# SPDX-License-Identifier: Apache-2.0
#
# Nightly: path normalization and violation identities on Windows (research
# doc 24, Phase 2 acceptance). A Windows checkout must produce the same
# canonical paths and the same identities as Linux, or every baseline churns.
# Uses no secrets. Actions are pinned to commit SHAs.

name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  windows-paths:
    name: windows-paths
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@engintel/policy...

      - name: Path normalization and identity vectors
        run: |
          pnpm --filter @engintel/config exec vitest run test/paths.test.ts
          pnpm --filter @engintel/policy exec vitest run test/identity.test.ts
