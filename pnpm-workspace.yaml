packages:
  - packages/*

# Exact pins for every third-party tool. Packages reference these as "catalog:".
# Upgrading any of these is a reviewed change (see docs/phase-0-decisions.md).
catalog:
  # TypeScript 6.0 is the last release with the JS compiler API
  # (ts.createProgram + TypeChecker) that D-002 depends on. 7.x is the native
  # port: its main entry exports only a version string. Do not bump to 7.x.
  typescript: 6.0.3
  "@types/node": 22.20.4
  turbo: 2.11.4
  vite: 8.3.1
  vitest: 5.0.2
  zod: 4.6.5
  ignore: 7.0.10
  picomatch: 4.0.7
  "@types/picomatch": 4.0.3
  commander: 15.0.0
  "@types/sarif": 2.1.7
  yaml: 2.9.1
  ajv: 8.20.0
  eslint: 10.11.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.70.1
  fast-check: 4.10.2
  # @engintel/graph is its only consumer (enforced by the workspace policy test).
  dependency-cruiser: 18.4.0

# Fail the install if any dependency wants to run a build script that has not
# been explicitly reviewed. Nothing is allowed to build.
strictDepBuilds: true
onlyBuiltDependencies: []

# dependency-cruiser loads TypeScript with an optional import from its own
# location and silently falls back to a JS-only parser (no `import type`) when
# it cannot. Declare the peer so pnpm links the pinned compiler explicitly
# instead of relying on hidden hoisting. Its supported range is <7.0.0.
packageExtensions:
  dependency-cruiser:
    peerDependencies:
      typescript: ">=5.0.0 <7.0.0"
